# Status-Based Border Template
# Dynamic border colors and labels based on show status using custom variables
# Demonstrates the template variables system with map-type variable lookups
# Note: Template ID is determined by the directory name

name: "Status-Radiant"
description: "Dynamic status-colored border and badge with radial vignette effect"
version: "1.1"
author: "PosterApp"

# Custom variables section
variables:
  # Status-based border color
  statusColor:
    type: "map"
    source: "{{status}}"
    mappings:
      "Returning Series": "#00FF00"  # Green
      "Ended": "#FF0000"              # Red
      "Canceled": "#FF0000"           # Red
      "In Production": "#FFA500"      # Orange
    default: "#FFFF00"                # Yellow

  # Status-based text label
  statusLabel:
    type: "map"
    source: "{{status}}"
    mappings:
      "Returning Series": "Returning Series"
      "Ended": "Ended"
      "Canceled": "Canceled"
      "In Production": "In Production"
    default: "UNKNOWN"

# ImageMagick command template
steps:
  - name: "Prepare poster base"
    commands: |
      ( {{posterPath}}
        -resize {{zoomedWidth}}x{{zoomedHeight}}^
        -gravity center
        -extent {{posterWidth}}x{{posterHeight}}
      )

  - name: "Add radial fade"
    commands: |
      ( -size {{posterWidth}}x{{posterHeight}}
        radial-gradient:none-black
      )
      -gravity south
      -composite

  - name: "Add status-based border"
    commands: |
      -stroke "{{statusColor}}"
      -strokewidth 9
      -fill none
      -draw "rectangle 40,40 960,1460"

  - name: "Add status badge"
    condition: hasStatus
    commands: |
      -strokewidth 0
      -gravity northeast
      -fill "{{statusColor}}"
      -pointsize 40
      -font Arial-Bold.ttf
      -annotate +60+60 "{{statusLabel}}"

  - name: "Add logo"
    condition: hasLogo
    commands: |
      ( {{logoPath}}
        -resize {{logoMaxWidth}}x{{logoTargetHeight}}
      )
      -gravity south
      -geometry +0+100
      -composite