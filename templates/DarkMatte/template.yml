# Default Poster Template
# This template replicates the original hardcoded poster generation behavior
# Users can copy this directory to create custom templates with different styles
# Note: Template ID is determined by the directory name

name: "DarkMatte Style"
description: "DarkMatte style with gradient overlay and logo placement"
version: "1.1"

steps:
  - name: "darken-base"
    args:
      - "-level"
      - "-54%,80%"
      - "-colorspace"
      - "RGB"

  - name: "gradient-overlay"
    args:
      - "{{templateResources}}/overlays/defaultGradient.png"
      - "-composite"

  - name: "add-logo"
    condition: "hasLogo"
    args:
      - "("
      - "{{logoPath}}"
      - "-resize"
      - "600x260"
      - ")"
      - "-gravity"
      - "south"
      - "-geometry"
      - "+0+175"
      - "-composite"

  - name: "season-label"
    condition: "isSeason"
    args:
      - "-font"
      - "{{templateResources}}/fonts/core-sans-a/CoreSansA65Bold.otf"
      - "-pointsize"
      - "40"
      - "-fill"
      - "white"
      - "-gravity"
      - "south"
      - "-annotate"
      - "+0+125"
      - "{{seasonName}}"
