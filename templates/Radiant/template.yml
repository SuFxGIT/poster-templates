# Radiant Frame Poster Template
# Thin yellow border with radial vignette effect
# Note: Template ID is determined by the directory name

name: "Radiant"
description: "Thin yellow border with dark radial vignette and small south-centered logo"
version: "1.1"
author: "PosterApp"

steps:
  - name: "add-radial-fade"
    args:
      - "("
      - "-size"
      - "{{posterWidth}}x{{posterHeight}}"
      - "radial-gradient:none-black"
      - ")"
      - "-gravity"
      - "south"
      - "-composite"

  - name: "add-border"
    args:
      - "-stroke"
      - "yellow"
      - "-strokewidth"
      - "3"
      - "-fill"
      - "none"
      - "-draw"
      - "rectangle 40,40 960,1460"

  - name: "add-logo"
    condition: "hasLogo"
    args:
      - "("
      - "{{logoPath}}"
      - "-resize"
      - "600x200"
      - ")"
      - "-gravity"
      - "south"
      - "-geometry"
      - "+0+100"
      - "-composite"