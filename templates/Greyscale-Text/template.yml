# Signature Frame Poster Template
# Black and white with faded border effect
# Note: Template ID is determined by the directory name

name: "Greyscale-Text"
description: "Black and white filter with faded border and small south-centered signature text"
version: "1.1"
author: "PosterApp"

steps:
  - name: "convert-to-greyscale"
    args:
      - "-colorspace"
      - "Gray"

  - name: "add-bottom-gray-fade"
    args:
      - "("
      - "-size"
      - "{{posterWidth}}x600"
      - "gradient:rgba(0,0,0,0)-rgba(0,0,0,0.6)"
      - ")"
      - "-gravity"
      - "south"
      - "-composite"

  - name: "add-faded-border"
    args:
      - "-stroke"
      - "rgba(255,255,255,0.3)"
      - "-strokewidth"
      - "50"
      - "-fill"
      - "none"
      - "-draw"
      - "rectangle 0,0 999,1499"
      - "-stroke"
      - "none"
      - "-strokewidth"
      - "0"

  - name: "show-title-text"
    condition: "title != null"
    args:
      - "("
      - "-background"
      - "none"
      - "-fill"
      - "white"
      - "-font"
      - "{{templateResources}}/fonts/Colus-Regular.ttf"
      - "-pointsize"
      - "96"
      - "-size"
      - "900x250"
      - "-gravity"
      - "center"
      - "caption:{{title|upper}}"
      - ")"
      - "-gravity"
      - "south"
      - "-geometry"
      - "+0+60"
      - "-composite"