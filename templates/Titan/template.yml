# Square Glow Poster Template
# Featured square at top with glowing border and dark textured frame
# Note: Template ID is determined by the directory name

name: "Titan"
description: "Elegant poster with subtle yellow gradient overlay and black ribbon with gold borders containing centered logo at the bottom"
version: "1.1"
author: "PosterApp"

steps:
  - name: "add-top-yellow-gradient"
    args:
      - "("
      - "-size"
      - "1000x400"
      - "gradient:yellow-transparent"
      - "-alpha"
      - "set"
      - "-channel"
      - "A"
      - "-evaluate"
      - "multiply"
      - "0.1"
      - "+channel"
      - ")"
      - "-gravity"
      - "north"
      - "-compose"
      - "over"
      - "-composite"

  - name: "add-ribbon-with-logo"
    condition: "hasLogo"
    args:
      - "("
      - "-size"
      - "1000x200"
      - "xc:black"
      - "-fill"
      - "gold"
      - "-draw"
      - "rectangle 0,0 1000,3"
      - "-fill"
      - "gold"
      - "-draw"
      - "rectangle 0,197 1000,200"
      - "("
      - "{{logoPath}}"
      - "-resize"
      - "500x160"
      - ")"
      - "-gravity"
      - "center"
      - "-compose"
      - "over"
      - "-composite"
      - ")"
      - "-gravity"
      - "south"
      - "-geometry"
      - "+0+75"
      - "-compose"
      - "over"
      - "-composite"

  - name: "add-ribbon-without-logo"
    condition: "not hasLogo"
    args:
      - "("
      - "-size"
      - "1000x200"
      - "xc:black"
      - "-fill"
      - "gold"
      - "-draw"
      - "rectangle 0,0 1000,3"
      - "-fill"
      - "gold"
      - "-draw"
      - "rectangle 0,197 1000,200"
      - ")"
      - "-gravity"
      - "south"
      - "-geometry"
      - "+0+75"
      - "-compose"
      - "over"
      - "-composite"