# Status-Based Border Template
# Dynamic border colors and labels based on show status using custom variables
# Demonstrates the template variables system with map-type variable lookups
# Note: Template ID is determined by the directory name

name: "Status-Radiant"
description: "Dynamic status-colored border and badge with radial vignette effect"
version: "1.2"
author: "PosterApp"

variables:
  statusColor:
    type: map
    source: "status"
    mappings:
      "Returning Series": "#00FF00"
      "Ended": "#FF0000"
      "Canceled": "#FF0000"
      "In Production": "#FFA500"
    default: "#FFFF00"

  statusLabel:
    type: map
    source: "status"
    mappings:
      "Returning Series": "Returning Series"
      "Ended": "Ended"
      "Canceled": "Canceled"
      "In Production": "In Production"
    default: "UNKNOWN"

steps:
  - name: "add-radial-fade"
    args:
      - "("
      - "-size"
      - "{{posterWidth}}x{{posterHeight}}"
      - "radial-gradient:none-black"
      - ")"
      - "-gravity"
      - "south"
      - "-composite"

  - name: "add-status-border"
    args:
      - "-stroke"
      - "{{statusColor}}"
      - "-strokewidth"
      - "9"
      - "-fill"
      - "none"
      - "-draw"
      - "rectangle 40,40 960,1460"

  - name: "add-status-badge"
    condition: "status != null"
    args:
      - "-strokewidth"
      - "0"
      - "-gravity"
      - "northeast"
      - "-fill"
      - "{{statusColor}}"
      - "-pointsize"
      - "40"
      - "-font"
      - "{{templateResources}}/fonts/Arial-Bold.ttf"
      - "-annotate"
      - "+60+60"
      - "{{statusLabel}}"

  - name: "add-logo"
    condition: "hasLogo"
    args:
      - "("
      - "{{logoPath}}"
      - "-resize"
      - "600x260"
      - ")"
      - "-gravity"
      - "south"
      - "-geometry"
      - "+0+100"
      - "-composite"