# Classic Poster Template
# Enhanced contrast with custom gradient overlay
# Uses musikman gradient for a different gradient effect
# Note: Template ID is determined by the directory name

name: "Nexus"
description: "Logo in the middle with a blurred background style"
version: "1.1"
author: "PosterApp"

steps:
  - name: "blur-and-darken"
    args:
      - "-blur"
      - "0x8"
      - "-fill"
      - "black"
      - "-colorize"
      - "50%"

  - name: "add-logo"
    condition: "hasLogo"
    args:
      - "("
      - "{{logoPath}}"
      - "-resize"
      - "700x300"
      - ")"
      - "-gravity"
      - "center"
      - "-composite"

  - name: "season-label"
    condition: "isSeason"
    args:
      - "-font"
      - "Arial-Bold"
      - "-pointsize"
      - "45"
      - "-fill"
      - "white"
      - "-stroke"
      - "black"
      - "-strokewidth"
      - "2"
      - "-gravity"
      - "south"
      - "-annotate"
      - "+0+100"
      - "{{seasonName}}"