# Bottom Logo Poster Template
# Subtle bottom fade with the logo placed at the bottom of the poster
# Note: Template ID is determined by the directory name

name: "Bottom-logo"
description: "Plain poster with a subtle bottom fade and the logo positioned at the bottom"
version: "1.1"
author: "PosterApp"

steps:
  - name: "add-bottom-fade"
    args:
      - "("
      - "-size"
      - "1000x350"
      - "gradient:none-rgba(0,0,0,0.6)"
      - ")"
      - "-gravity"
      - "south"
      - "-compose"
      - "over"
      - "-composite"

  - name: "add-logo"
    condition: "hasLogo"
    args:
      - "("
      - "{{logoPath}}"
      - "-resize"
      - "600x200>"
      - ")"
      - "-gravity"
      - "south"
      - "-geometry"
      - "+0+100"
      - "-compose"
      - "over"
      - "-composite"
