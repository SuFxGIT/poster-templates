# Dynamic Fade Poster Template
# Fade color adapts dynamically based on poster's dominant color
# Note: Template ID is determined by the directory name

name: "Dynamic Fade"
description: "Filter with dynamic fade based on poster's dominant color"
version: "2.1"
author: "PosterApp"

steps:
  - name: "save-poster-to-register"
    args:
      - "+write"
      - "mpr:poster"

  - name: "extract-dominant-color"
    args:
      - "("
      - "mpr:poster"
      - "-gravity"
      - "south"
      - "-crop"
      - "100%x30%+0+0"
      - "+repage"
      - "-scale"
      - "1x1!"
      - "-alpha"
      - "off"
      - "+write"
      - "mpr:dominant"
      - "+delete"
      - ")"

  - name: "add-dominant-color-bottom"
    args:
      - "("
      - "mpr:dominant"
      - "-resize"
      - "1000x200!"
      - ")"
      - "-gravity"
      - "south"
      - "-composite"

  - name: "add-gradient-fade"
    args:
      - "("
      - "mpr:dominant"
      - "-resize"
      - "1000x300!"
      - "("
      - "-size"
      - "1000x300"
      - "gradient:black-white"
      - ")"
      - "-alpha"
      - "off"
      - "-compose"
      - "copy-opacity"
      - "-composite"
      - ")"
      - "-gravity"
      - "south"
      - "-geometry"
      - "+0+200"
      - "-compose"
      - "over"
      - "-composite"

  - name: "add-logo"
    condition: "hasLogo"
    args:
      - "("
      - "{{logoPath}}"
      - "-resize"
      - "600x260"
      - ")"
      - "-gravity"
      - "south"
      - "-geometry"
      - "+0+175"
      - "-composite"